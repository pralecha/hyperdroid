name: Build Android APK
​on:
push:
branches: [ "main", "master" ]
pull_request:
branches: [ "main", "master" ]
workflow_dispatch: # Umožňuje ruční spuštění přes tlačítko na GitHubu
​jobs:
build:
runs-on: ubuntu-latest
​steps:
- name: Checkout kód repozitáře
uses: actions/checkout@v4
with:
submodules: recursive
​- name: Nastavení JDK 17
uses: actions/setup-java@v4
with:
java-version: '17'
distribution: 'temurin'
​- name: Nastavení a kešování Gradle
uses: gradle/actions/setup-gradle@v4
​- name: Nastavení spustitelnosti pro gradlew
run: chmod +x gradlew
​- name: Kompilace Debug APK
run: ./gradlew assembleDebug
​- name: Nahrání vygenerovaného APK jako Artifact
uses: actions/upload-artifact@v4
with:
name: app-debug-apk
path: app/build/outputs/apk/debug/*.apk
